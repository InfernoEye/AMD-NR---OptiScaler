name: Avalonia Linux build

on:
  push:
    paths:
      - "linux/**"
      - ".github/workflows/avalonia-linux.yml"
  pull_request:
    paths:
      - "linux/**"
      - ".github/workflows/avalonia-linux.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore linux/avalonia/Amdnr.Linux.Desktop.csproj
      - name: Build Avalonia desktop
        run: dotnet build linux/avalonia/Amdnr.Linux.Desktop.csproj -c Release --no-restore
