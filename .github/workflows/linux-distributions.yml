name: Linux distributable packages

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-linux-launcher
    tags:
      - 'linux-v*'
    paths:
      - 'Launcher/Avalonia/**'
      - 'packaging/**'
      - '.github/workflows/linux-distributions.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Download self-contained CPython 3.12
        run: |
          export UV_PYTHON_INSTALL_DIR="$PWD/dist/managed-python"
          uv python install 3.12
          uv python find 3.12 --python-preference only-managed > dist/managed-python-executable.txt
          echo "Bundling: $(cat dist/managed-python-executable.txt)"
          test -x "$(cat dist/managed-python-executable.txt)"
      - name: Test independent Linux backend
        run: python3 -m unittest discover -s Launcher/Avalonia/tests -p 'test_*.py'
      - name: Stamp tagged launcher version
        if: startsWith(github.ref, 'refs/tags/linux-v')
        run: echo "$GITHUB_REF_NAME" > Launcher/Avalonia/VERSION
      - name: Stamp first beta launcher version
        if: github.ref == 'refs/heads/feature/native-linux-launcher'
        run: echo "linux-v0.1.0-beta.1" > Launcher/Avalonia/VERSION
      - name: Publish self-contained Linux launcher
        run: >-
          dotnet publish Launcher/Avalonia/Amdnr.Avalonia.csproj
          --configuration Release --runtime linux-x64 --self-contained true
          -p:PublishSingleFile=true -o dist/publish
      - name: Create portable AppDir
        run: bash packaging/linux/build-appdir.sh dist/publish dist/AMDNR-Linux.AppDir "$(cat dist/managed-python-executable.txt)"
      - name: Smoke test portable backend
        run: |
          APPDIR="$PWD/dist/AMDNR-Linux.AppDir" \
            dist/AMDNR-Linux.AppDir/usr/bin/python3 \
            dist/AMDNR-Linux.AppDir/usr/share/amdnr/amdnr_launcher.py --help
          APPDIR="$PWD/dist/AMDNR-Linux.AppDir" \
            dist/AMDNR-Linux.AppDir/usr/bin/python3 -m unittest discover \
            -s Launcher/Avalonia/tests -p 'test_*.py'
          test -x dist/AMDNR-Linux.AppDir/usr/lib/amdnr/Amdnr.Avalonia
          test -x dist/AMDNR-Linux.AppDir/usr/lib/amdnr-python/bin/python3
      - name: Download SHA-256 pinned AppImageKit tool
        run: |
          mkdir -p dist/tools
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output dist/tools/appimagetool-x86_64.AppImage
          # Tool release sha256 was verified against its public GitHub asset metadata.
          echo 'e8c1169c4af66c3184d7ee110713d4be04befe671fa358e2c1591ee840553b03  dist/tools/appimagetool-x86_64.AppImage' | sha256sum --check
          chmod +x dist/tools/appimagetool-x86_64.AppImage
      - name: Build AppImage and portable tarball
        run: |
          ARCH=x86_64 dist/tools/appimagetool-x86_64.AppImage --appimage-extract-and-run \
            dist/AMDNR-Linux.AppDir dist/AMDNR-Linux-x86_64.AppImage
          tar -C dist -czf dist/AMDNR-Linux-x86_64.tar.gz AMDNR-Linux.AppDir
          (cd dist && sha256sum AMDNR-Linux-x86_64.AppImage AMDNR-Linux-x86_64.tar.gz > SHA256SUMS.txt)
      - name: Upload packages to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amdnr-linux-x86_64
          path: |
            dist/AMDNR-Linux-x86_64.AppImage
            dist/AMDNR-Linux-x86_64.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish Linux branch prerelease
        if: github.ref == 'refs/heads/feature/native-linux-launcher'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Unique, immutable tag per successful build. Do not reuse the
          # original beta.1 tag; it points to an older commit.
          TAG="linux-v0.1.0-beta.${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Prerelease $TAG already published for this run."
          else
            gh release create "$TAG" \
              dist/AMDNR-Linux-x86_64.AppImage \
              dist/AMDNR-Linux-x86_64.tar.gz \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "AMDNR Linux Launcher $TAG (testing)" \
              --notes "Automated Linux x86_64 AppImage build for commit $GITHUB_SHA. Includes the standalone .NET 10 and CPython 3.12 launcher. Built and smoke-tested in CI; rendering compatibility under Proton is not guaranteed. The original Windows launcher is unchanged." 
          fi
      - name: Publish tagged Linux release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/AMDNR-Linux-x86_64.AppImage \
            dist/AMDNR-Linux-x86_64.tar.gz \
            dist/SHA256SUMS.txt \
            --title "AMDNR Linux $GITHUB_REF_NAME" \
            --notes "Independent Linux/Proton launcher; Windows AMDNR downloads are verified separately against upstream 3zwr1 releases." \
            --verify-tag

  flatpak:
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Linux files
        run: >-
          dotnet publish Launcher/Avalonia/Amdnr.Avalonia.csproj
          --configuration Release --runtime linux-x64 --self-contained true
          -p:PublishSingleFile=true -o packaging/flatpak/publish
      - name: Bundle backend in Flatpak source tree
        run: |
          mkdir -p packaging/flatpak/backend
          cp Launcher/Avalonia/*.py packaging/flatpak/backend/
          cp Launcher/Avalonia/VERSION packaging/flatpak/backend/
          cp -a Launcher/Avalonia/model-tools packaging/flatpak/backend/
      - name: Install Flatpak tooling and Freedesktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.freedesktop.Sdk//25.08 org.freedesktop.Platform//25.08
      - name: Build and export Flatpak
        run: |
          flatpak-builder --user --force-clean --repo=dist/flatpak-repo \
            dist/flatpak-build packaging/flatpak/org.amdnr.LinuxLauncher.yml
          flatpak build-bundle dist/flatpak-repo \
            dist/AMDNR-Linux-x86_64.flatpak org.amdnr.LinuxLauncher
      - uses: actions/upload-artifact@v4
        with:
          name: amdnr-linux-flatpak-x86_64
          path: dist/AMDNR-Linux-x86_64.flatpak
          if-no-files-found: error
