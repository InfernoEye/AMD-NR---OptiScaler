name: Linux launcher

on:
  push:
    paths:
      - "Launcher/Avalonia/**"
      - ".github/workflows/linux-launcher.yml"
  pull_request:
    paths:
      - "Launcher/Avalonia/**"
      - ".github/workflows/linux-launcher.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile Launcher/Avalonia/amdnr_launcher.py
      - name: Tests
        run: python -m unittest discover -s Launcher/Avalonia/tests -v
      - name: CLI help
        run: python Launcher/Avalonia/amdnr_launcher.py --help
