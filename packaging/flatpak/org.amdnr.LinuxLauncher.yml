app-id: org.amdnr.LinuxLauncher
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: amdnr-launcher
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The installer must access arbitrary mounted Steam/Proton library directories.
  # Users should explicitly review this broad permission before installing.
  - --filesystem=host
  - --filesystem=xdg-config
  - --filesystem=xdg-data
  - --filesystem=xdg-cache
modules:
  - name: amdnr-native-linux
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib/amdnr /app/share/amdnr /app/share/applications /app/share/icons/hicolor/128x128/apps
      - cp -a publish/. /app/lib/amdnr/
      - cp -a backend/. /app/share/amdnr/
      - install -Dm755 amdnr-launcher /app/bin/amdnr-launcher
      - install -Dm644 amdnr-linux.desktop /app/share/applications/org.amdnr.LinuxLauncher.desktop
      - python3 make_icon.py /app/share/icons/hicolor/128x128/apps/org.amdnr.LinuxLauncher.png
      - chmod +x /app/lib/amdnr/Amdnr.Avalonia
    sources:
      - type: dir
        path: publish
        dest: publish
      - type: dir
        path: backend
        dest: backend
      - type: file
        path: amdnr-launcher
      - type: file
        path: ../linux/amdnr-linux.desktop
      - type: file
        path: ../linux/make_icon.py
